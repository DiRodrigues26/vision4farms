name: vision4farms
description: "Vision4Farms — Plataforma mobile de gestão agrícola digital"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  app_links: ^6.3.2
  
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3

  mapbox_maps_flutter: ^2.3.0
  # Navegação
  go_router: ^13.0.0

  # Gestão de estado
  provider: ^6.1.2

  # HTTP / API
  dio: ^5.4.0

  # Armazenamento local (tokens JWT)
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Utilitários
  intl: ^0.19.0
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  url_launcher: ^6.2.5
  open_filex: ^4.5.0
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0+1
  fl_chart: ^0.69.2
  path_provider: ^2.1.3

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true